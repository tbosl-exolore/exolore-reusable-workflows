name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    uses: tbosl-exolore/exolore-reusable-workflows/.github/workflows/verify.yml@0123456789abcdef0123456789abcdef01234567
    permissions:
      contents: read
    with:
      test_script: scripts/ci.sh

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: verify
    uses: tbosl-exolore/exolore-reusable-workflows/.github/workflows/deploy-container.yml@0123456789abcdef0123456789abcdef01234567
    permissions:
      contents: read
      packages: write
    with:
      working_directory: .
      build_context: .
      dockerfile: Dockerfile
      compose_file: compose.yaml
      project_config_file: deploy/project.env
      environment_name: production
